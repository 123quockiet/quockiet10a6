      left: 0 !important;

      margin: 0 !important;

      font-weight: 700;
      font-size: 11px;

// 2. RETRO WEB AUDIO SYNTHESIZER
// ----------------------------------------------------------------------------
class RetroAudioSynth {
  constructor() {
    this.ctx = null;
    this.isMuted = false;
    this.bgmTimer = null;
    this.bgmStep = 0;
    this.init();
  }

  init() {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (AudioCtx) this.ctx = new AudioCtx();
  }

  resume() {
    if (!this.ctx) this.init();
    if (this.ctx && this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
  }

  toggleMute() {
    this.isMuted = !this.isMuted;
    if (this.isMuted) {
      this.stopBGM();
    } else {
      this.startBGM();
    }
    return this.isMuted;
  }

  playTone(freq, type, duration, vol = 0.2, freqEnd = null) {
    if (this.isMuted || !this.ctx) return;
    this.resume();
    try {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
      if (freqEnd !== null) {
        osc.frequency.exponentialRampToValueAtTime(Math.max(10, freqEnd), this.ctx.currentTime + duration);
      }
      gain.gain.setValueAtTime(vol, this.ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start();
      osc.stop(this.ctx.currentTime + duration);
    } catch(e) {}
  }

  playJump() {
    this.playTone(180, 'square', 0.16, 0.18, 480);
  }

  playSwordSlash() {
    this.playTone(850, 'sawtooth', 0.18, 0.25, 120);
  }

  playCritHit() {
    if (this.isMuted || !this.ctx) return;
    this.resume();
    [220, 440, 880, 1400].forEach((f) => {
      this.playTone(f, 'sawtooth', 0.25, 0.25, 80);
    });
  }

  playPlayerHurt() {
    this.playTone(160, 'square', 0.22, 0.35, 45);
  }

  playMonsterAttack() {
    this.playTone(320, 'sawtooth', 0.22, 0.3, 70);
  }

  playCorrect() {
    if (this.isMuted || !this.ctx) return;
    this.resume();
    const notes = [523.25, 659.25, 783.99, 1046.50];
    notes.forEach((freq, idx) => {
      setTimeout(() => this.playTone(freq, 'triangle', 0.2, 0.25), idx * 75);
    });
  }

  playWrong() {
    if (this.isMuted || !this.ctx) return;
    this.resume();
    this.playTone(200, 'sawtooth', 0.25, 0.3, 100);
    setTimeout(() => this.playTone(150, 'sawtooth', 0.35, 0.35, 65), 120);
  }

  playLevelUp() {
    if (this.isMuted || !this.ctx) return;
    this.resume();
    const arpeggio = [440, 554, 659, 880, 1108, 1318, 1760];
    arpeggio.forEach((note, i) => {
      setTimeout(() => this.playTone(note, 'triangle', 0.22, 0.25), i * 60);
    });
  }

  playCoin() {
    this.playTone(987.77, 'sine', 0.08, 0.2);
    setTimeout(() => this.playTone(1318.51, 'sine', 0.22, 0.25), 70);
  }

  playClick() {
    this.playTone(800, 'triangle', 0.04, 0.12, 1200);
  }

  startBGM() {
    if (this.bgmTimer || this.isMuted) return;
    this.resume();
    const melody = [
      261.63, 0, 329.63, 392.00, 0, 329.63, 261.63, 0,
      293.66, 0, 349.23, 440.00, 0, 349.23, 293.66, 0,
      329.63, 0, 392.00, 523.25, 0, 392.00, 329.63, 0,
      246.94, 0, 293.66, 392.00, 0, 293.66, 246.94, 0
    ];
    this.bgmStep = 0;
    this.bgmTimer = setInterval(() => {
      if (this.isMuted) return;
      const freq = melody[this.bgmStep % melody.length];
      if (freq > 0) {
        this.playTone(freq, 'triangle', 0.16, 0.06);
        this.playTone(freq / 2, 'sine', 0.18, 0.07);
      }
      this.bgmStep++;
    }, 180);
  }

  stopBGM() {
    if (this.bgmTimer) {
      clearInterval(this.bgmTimer);
      this.bgmTimer = null;
    }
  }
}

      if (window.showVirtualControls) window.showVirtualControls();
    });
    this.events.on('resume', () => { 
      this.isInCombat = false; 
      if (window.showVirtualControls) window.showVirtualControls();
    });

    if (window.showVirtualControls) window.showVirtualControls();
  }

  createParallax() {
    for (let x = 0; x < this.worldWidth; x += 1370) {
      if (this.textures.exists('asset_map')) {
        const bgM = this.add.image(x, 220, 'asset_map', 'bg_mountains').setOrigin(0, 0.5).setScrollFactor(0.2);
        bgM.setDisplaySize(1376, 500);

        const bgF = this.add.image(x, 390, 'asset_map', 'bg_forest').setOrigin(0, 0.5).setScrollFactor(0.5);
        bgF.setDisplaySize(1376, 450);
        bgF.setAlpha(0.75);
      }
    }
  }

  createTerrain() {
    this.platforms = this.physics.add.staticGroup();

    // Continuous Ground
    for (let x = 0; x < this.worldWidth; x += 250) {
      let ground;
      if (this.textures.exists('tile_grass')) {
        ground = this.platforms.create(x + 125, this.groundY + 50, 'tile_grass');
        ground.setDisplaySize(250, 120);
      } else {
        const r = this.add.rectangle(x + 125, this.groundY + 50, 250, 120, 0x3d2817);
        ground = this.platforms.add(r);
      }
      ground.refreshBody();
    }

    // Elevated Platforms
    const platformLocations = [
      { x: 1050, y: 480, w: 220 },
      { x: 1650, y: 450, w: 250 },
      { x: 2250, y: 460, w: 220 },
      { x: 2850, y: 440, w: 260 },
      { x: 3500, y: 460, w: 220 },
      { x: 4200, y: 450, w: 260 },
      { x: 4850, y: 440, w: 240 },
      { x: 5500, y: 450, w: 320 }
    ];

    platformLocations.forEach(loc => {
      let p;
      if (this.textures.exists('tile_grass')) {
        p = this.platforms.create(loc.x, loc.y, 'tile_grass');
        p.setDisplaySize(loc.w, 35);
      } else {
        const r = this.add.rectangle(loc.x, loc.y, loc.w, 35, 0x4a7c29);
        p = this.platforms.add(r);
      }
      p.refreshBody();
    });

    // Decorative Props from extracted assets
    if (this.textures.exists('prop_cave')) {
      this.add.image(6650, this.groundY - 100, 'prop_cave').setDisplaySize(380, 260);
    }
    if (this.textures.exists('prop_chest')) {
      this.add.image(1050, 435, 'prop_chest').setDisplaySize(55, 45);
      this.add.image(2850, 395, 'prop_chest').setDisplaySize(55, 45);
    }
    if (this.textures.exists('prop_barrel')) {
      this.add.image(580, this.groundY - 30, 'prop_barrel').setDisplaySize(45, 45);
      this.add.image(1380, this.groundY - 30, 'prop_barrel').setDisplaySize(45, 45);
    }
    if (this.textures.exists('prop_torch')) {
      this.add.image(400, this.groundY - 45, 'prop_torch').setDisplaySize(35, 45);
      this.add.image(1200, this.groundY - 45, 'prop_torch').setDisplaySize(35, 45);
    }
    if (this.textures.exists('prop_sign')) {
      this.add.image(850, this.groundY - 35, 'prop_sign').setDisplaySize(45, 45);
    }
  }

  createPlayer() {

  createMonsters() {
    this.monsters = [];
    GAME_DATA.monsters.forEach((mData, idx) => {
      if (window.defeatedMonsters.includes(mData.id)) return;

      let textureKey = 'mon_' + mData.id;
      if (!this.textures.exists(textureKey)) {
        if (mData.id === 'malakar_p1') textureKey = 'mon_boss_malakar';
        else if (mData.id === 'malakar_p2') textureKey = 'mon_boss_malakar_p2';
        else if (mData.type === 'boss') textureKey = 'mon_boss_malakar';
        else textureKey = 'mon_slime';
      }

      // Proportional scaling for each monster tier
      let mScale = 0.58;
      if (mData.type === 'boss') mScale = 0.8;
      else if (mData.type === 'medium') mScale = 0.55;

      const mon = this.physics.add.sprite(mData.x, this.groundY - 10, textureKey);
      mon.setOrigin(0.5, 1);
      mon.setScale(mScale);
      mon.setDepth(10);
      mon.setCollideWorldBounds(true);
      this.physics.add.collider(mon, this.platforms);

      // Facing orientation towards approaching player
      if (mData.id === 'panther' || mData.id === 'mushroom') {
        mon.setFlipX(true);
      }

      const monH = mon.displayHeight || 90;
      const tagColor = mData.type === 'boss' ? '#ff3366' : (mData.type === 'medium' ? '#ffaa00' : '#44ff88');
      const nameTag = this.add.text(mData.x, this.groundY - monH - 25, `${idx + 1}. ${mData.name}`, {
        fontFamily: '"Be Vietnam Pro", sans-serif',
        fontWeight: '700',
        fontSize: '10px',
        color: tagColor,
        backgroundColor: '#0a0a16',
        padding: { x: 5, y: 3 }
      }).setOrigin(0.5).setDepth(15);

      const questIcon = this.add.text(mData.x, this.groundY - monH - 48, '⚔️', { fontSize: '15px' }).setOrigin(0.5).setDepth(15);
      this.tweens.add({
        targets: questIcon,
        y: this.groundY - monH - 58,
        duration: 700,
        yoyo: true,
        repeat: -1
      });

      mon.dataRef = mData;
      mon.nameTag = nameTag;
      mon.questIcon = questIcon;

      mon.setInteractive({ useHandCursor: true });
      mon.on('pointerdown', () => {
        if (!this.isInCombat) this.startCombat(mon);
      });
      questIcon.setInteractive({ useHandCursor: true });
      questIcon.on('pointerdown', () => {
        if (!this.isInCombat) this.startCombat(mon);
      });

      this.tweens.add({
        targets: mon,
        x: mData.x + 35,
        duration: 2200,
        yoyo: true,
        repeat: -1,
        ease: 'Sine.easeInOut'
      });

      this.monsters.push(mon);
    });
  }

  handleDefeatedMonster(monsterId) {
    this.isInCombat = false;

    if (!window.defeatedMonsters.includes(monsterId)) {
      window.defeatedMonsters.push(monsterId);
    }

    const monIdx = this.monsters.findIndex(m => m.dataRef.id === monsterId);
    if (monIdx !== -1) {
      const mon = this.monsters[monIdx];
      if (mon.nameTag) mon.nameTag.destroy();
      if (mon.questIcon) mon.questIcon.destroy();
      mon.destroy();
      this.monsters.splice(monIdx, 1);
    }

    this.showChapterBanner(`ĐÃ DIỆT QUÁI THÀNH CÔNG!`);
  }

  update() {
    if (this.isDialogueOpen || this.isShopOpen || this.isInventoryOpen) {
      this.player.setVelocityX(0);
      return;
    }

    const speed = GAME_DATA.player.speed;
    const isMovingLeft = this.cursors.left.isDown || this.keyA.isDown || (window.touchControls && window.touchControls.left);
    const isMovingRight = this.cursors.right.isDown || this.keyD.isDown || (window.touchControls && window.touchControls.right);
    const isJumping = this.cursors.up.isDown || this.keyW.isDown || this.keySpace.isDown || (window.touchControls && window.touchControls.jump);

    if (isMovingLeft) {
      this.player.setVelocityX(-speed);
      this.player.setFlipX(true);
      if (this.player.body.touching.down && this.anims.exists('anim_player_run') && this.player.anims.currentAnim?.key !== 'anim_player_run') {
        this.player.play('anim_player_run');
      }
    } else if (isMovingRight) {
      this.player.setVelocityX(speed);
      this.player.setFlipX(false);
      if (this.player.body.touching.down && this.anims.exists('anim_player_run') && this.player.anims.currentAnim?.key !== 'anim_player_run') {
        this.player.play('anim_player_run');
      }
    } else {
      this.player.setVelocityX(0);
      if (this.player.body.touching.down && this.anims.exists('anim_player_idle') && this.player.anims.currentAnim?.key !== 'anim_player_idle') {
        this.player.play('anim_player_idle');
      }
    }

    if (isJumping && this.player.body.touching.down) {
      this.player.setVelocityY(-430);
      audioSynth.playJump();
    }

    const isInteract = Phaser.Input.Keyboard.JustDown(this.keyE) || (window.touchControls && window.touchControls.interactJustPressed);
    if (window.touchControls) window.touchControls.interactJustPressed = false;

    if (isInteract) {
      const distToWizard = Phaser.Math.Distance.Between(this.player.x, this.player.y, this.wizardObj.x, this.wizardObj.y);
      const distToArthur = Phaser.Math.Distance.Between(this.player.x, this.player.y, this.arthurObj.x, this.arthurObj.y);

      if (distToWizard < 120) {
        this.openDialogue(GAME_DATA.dialogues.wizardIntro);
      } else if (distToArthur < 120) {
        this.openShop();
      }
    }

    if (Phaser.Input.Keyboard.JustDown(this.keyI) || Phaser.Input.Keyboard.JustDown(this.keyC)) {
      this.toggleInventoryModal();
    }

    this.monsters.forEach(m => {
      if (!m.active) return;
      const dist = Phaser.Math.Distance.Between(this.player.x, this.player.y, m.x, m.y);
      if (dist < 110 && !this.isInCombat) {
        this.startCombat(m);
      }
    });

    this.monsters.forEach(m => {
      if (m.nameTag) {
        m.nameTag.x = m.x;
      }
      if (m.questIcon) {
        m.questIcon.x = m.x;
      }
    });

    this.updateHUD();
  }

  startCombat(monsterSprite) {
    if (this.isInCombat) return;
    this.isInCombat = true;
    if (window.hideVirtualControls) window.hideVirtualControls();
    audioSynth.playMonsterAttack();
    this.cameras.main.flash(300, 255, 255, 255);
    this.time.delayedCall(200, () => {
      this.scene.pause();
      this.scene.launch('CombatScene', {
        monsterData: monsterSprite.dataRef,
        playerX: this.player.x,
        question: GAME_DATA.questions[monsterSprite.dataRef.questionIndex]
      });
    });
  }

  updateHUD() {
    const p = GAME_DATA.player;
    const hpRatio = Math.max(0, p.hp / p.maxHp);
    this.hpBarFill.width = 192 * hpRatio;
    // Color shift: green → yellow → red
    if (hpRatio > 0.5) this.hpBarFill.fillColor = 0x22dd55;
    else if (hpRatio > 0.25) this.hpBarFill.fillColor = 0xffcc00;
    else this.hpBarFill.fillColor = 0xff2244;
    this.hpLabel.setText(`${Math.max(0, Math.floor(p.hp))}/${p.maxHp}`);

    let hStr = '';
    for (let i = 0; i < p.hearts; i++) hStr += '❤️';
    for (let i = p.hearts; i < 3; i++) hStr += '🖤';
    this.heartText.setText(hStr);

    const mpRatio = Math.max(0, p.mp / p.maxMp);
    this.mpBarFill.width = 192 * mpRatio;

    const expRatio = Math.max(0, p.exp / p.maxExp);
    this.expBarFill.width = 192 * expRatio;

    this.goldTxt.setText(`🪙 ${p.gold} VÀNG`);
    this.gemTxt.setText(`💎 ${p.gems} ĐÁ QUÝ`);
    this.keyTxt.setText(`🗝️ ${p.keys || 1} KHÓA`);

    // Minimap Radar — draw dots for player + monsters
    this.radarGfx.clear();
    const miniX = this.cameras.main.width - 85;
    const miniY = 80;
    const radius = 45;

    const pNorm = this.player.x / this.worldWidth;
    const pRadarX = miniX - radius + (pNorm * radius * 2);
    // Player dot — bright green with glow
    this.radarGfx.fillStyle(0x00ff99, 1);
    this.radarGfx.fillCircle(pRadarX, miniY, 5);
    this.radarGfx.fillStyle(0xffffff, 0.4);
    this.radarGfx.fillCircle(pRadarX, miniY - 1, 2);

    this.monsters.forEach(m => {
      if (!m.active) return;
      const mNorm = m.x / this.worldWidth;
      const mRadarX = miniX - radius + (mNorm * radius * 2);
      if (m.dataRef.type === 'boss') {
        this.radarGfx.fillStyle(0xff0033, 1);
        this.radarGfx.fillCircle(mRadarX, miniY, 5);
      } else {
        this.radarGfx.fillStyle(0xffaa00, 1);
        this.radarGfx.fillCircle(mRadarX, miniY, 4);
      }
    });
  }

  drinkPotion(type) {
    if (type === 'hp') {
      if (GAME_DATA.player.hp >= GAME_DATA.player.maxHp) return;
      GAME_DATA.player.hp = Math.min(GAME_DATA.player.maxHp, GAME_DATA.player.hp + 40);
      audioSynth.playCorrect();
      this.showFloatingNotice(this.player.x, this.player.y - 70, '+40 HP', '#00ff88');
    } else {
      if (GAME_DATA.player.mp >= GAME_DATA.player.maxMp) return;
      GAME_DATA.player.mp = Math.min(GAME_DATA.player.maxMp, GAME_DATA.player.mp + 30);
      audioSynth.playCorrect();
      this.showFloatingNotice(this.player.x, this.player.y - 70, '+30 MP', '#00e5ff');
    }
    this.updateHUD();
  }

  showFloatingNotice(x, y, text, color) {
    const t = this.add.text(x, y, text, {
      fontFamily: '"Be Vietnam Pro", sans-serif',
      fontWeight: '800',
      fontSize: '14px',
      color: color,
      stroke: '#000000',
      strokeThickness: 4
    }).setOrigin(0.5);

    this.tweens.add({
      targets: t,
      y: y - 45,
      alpha: 0,
      duration: 900,
      onComplete: () => t.destroy()
    });
  }

  showChapterBanner(text) {
    const w = this.cameras.main.width;
    const banner = this.add.container(w / 2, 170).setScrollFactor(0);
    const bg = this.add.rectangle(0, 0, 560, 52, 0x0b0e1a, 0.9);
    bg.setStrokeStyle(3, 0xffd700);

    const txt = this.add.text(0, 0, text, {
      fontFamily: '"Be Vietnam Pro", sans-serif',
      fontWeight: '800',
      fontSize: '15px',
      color: '#ffd700',
      letterSpacing: 1
    }).setOrigin(0.5);

    banner.add([bg, txt]);
    banner.setScale(0);

    this.tweens.add({
      targets: banner,
      scale: 1,
      duration: 350,
      ease: 'Back.easeOut',
      onComplete: () => {
        this.time.delayedCall(2200, () => {
          this.tweens.add({
            targets: banner,
            alpha: 0,
            y: 120,
            duration: 400,
            onComplete: () => banner.destroy()
          });
        });
      }
    });
  }

  openDialogue(dialogueLines) {
    this.isDialogueOpen = true;
    audioSynth.playClick();
    const w = this.cameras.main.width;
    const h = this.cameras.main.height;

    const container = this.add.container(0, 0).setScrollFactor(0);
    const bg = this.add.rectangle(w / 2, h - 110, w - 80, 160, 0x101526, 0.98);
    bg.setStrokeStyle(3, 0xffd700);

    const pFrame = this.add.rectangle(120, h - 110, 95, 95, 0x1f2942);
    pFrame.setStrokeStyle(2, 0x4a6fa5);
    const pIcon = this.add.text(120, h - 110, '🧙', { fontSize: '42px' }).setOrigin(0.5);

    let idx = 0;
    const speaker = this.add.text(190, h - 170, dialogueLines[0].speaker, {
      fontFamily: '"Be Vietnam Pro", sans-serif',
      fontWeight: '800',
      fontSize: '15px',
      color: '#ffd700'
    });

    const body = this.add.text(190, h - 135, dialogueLines[0].text, {
      fontFamily: '"Be Vietnam Pro", sans-serif',
      fontWeight: '600',
      fontSize: '13.5px',
      color: '#ffffff',
      wordWrap: { width: w - 300 },
      lineSpacing: 8
    });

    const nextTip = this.add.text(w - 260, h - 50, 'NHẤP CHUỘT / [E] ĐỂ TIẾP TỤC ⏩', {
      fontFamily: '"Be Vietnam Pro", sans-serif',
      fontWeight: '700',
      fontSize: '12px',
      color: '#00e5ff'
    });

    container.add([bg, pFrame, pIcon, speaker, body, nextTip]);

    const advance = () => {
      audioSynth.playClick();
      idx++;
      if (idx < dialogueLines.length) {
        speaker.setText(dialogueLines[idx].speaker);
        body.setText(dialogueLines[idx].text);
      } else {
        container.destroy();
        this.isDialogueOpen = false;
      }
    };

    bg.setInteractive({ useHandCursor: true });
    bg.on('pointerdown', advance);
  }

  openShop() {
    this.isShopOpen = true;
    audioSynth.playClick();
    const w = this.cameras.main.width;
    const h = this.cameras.main.height;

    const shop = this.add.container(0, 0).setScrollFactor(0);
    const dimmer = this.add.rectangle(w / 2, h / 2, w, h, 0x000000, 0.75).setInteractive();

    const panel = this.add.rectangle(w / 2, h / 2, 780, 460, 0x121729, 0.98);
    panel.setStrokeStyle(3, 0x00e5ff);

    const title = this.add.text(w / 2, h / 2 - 195, '🏪 CỬA HÀNG THỢ RÈN ARTHUR', {
      fontFamily: '"Be Vietnam Pro", sans-serif',
      fontWeight: '800',
      fontSize: '16px',
      color: '#ffd700'
    }).setOrigin(0.5);

    shop.add([dimmer, panel, title]);

    GAME_DATA.shopItems.forEach((item, idx) => {
      const iy = h / 2 - 120 + idx * 72;
      const box = this.add.rectangle(w / 2, iy, 700, 58, 0x1c2438);
      box.setStrokeStyle(1, 0x4a6fa5);

      const itemName = this.add.text(w / 2 - 320, iy - 16, item.name, {
        fontFamily: '"Be Vietnam Pro", sans-serif',
        fontWeight: '800',
        fontSize: '13px',
        color: '#ffffff'
      });

      const itemDesc = this.add.text(w / 2 - 320, iy + 8, item.desc, {
        fontFamily: '"Be Vietnam Pro", sans-serif',
        fontWeight: '500',
        fontSize: '11px',
        color: '#a0aec0'
      });

      const buyBtn = this.add.rectangle(w / 2 + 250, iy, 140, 36, 0xffaa00);
      buyBtn.setInteractive({ useHandCursor: true });
      const buyText = this.add.text(w / 2 + 250, iy, `${item.cost} VÀNG`, {
        fontFamily: '"Be Vietnam Pro", sans-serif',
        fontWeight: '800',
        fontSize: '12px',
        color: '#000000'
      }).setOrigin(0.5);

      buyBtn.on('pointerdown', () => {
        if (GAME_DATA.player.gold >= item.cost) {
          GAME_DATA.player.gold -= item.cost;
          audioSynth.playCoin();
          if (item.effect.hp) GAME_DATA.player.hp = Math.min(GAME_DATA.player.maxHp, GAME_DATA.player.hp + item.effect.hp);
          if (item.effect.attack) GAME_DATA.player.attack += item.effect.attack;
          buyText.setText("ĐÃ MUA!");
          this.time.delayedCall(800, () => buyText.setText(`${item.cost} VÀNG`));
          this.updateHUD();
        } else {
          audioSynth.playWrong();
          buyText.setText("THIẾU VÀNG!");
          this.time.delayedCall(800, () => buyText.setText(`${item.cost} VÀNG`));
        }
      });

      shop.add([box, itemName, itemDesc, buyBtn, buyText]);
    });

    const closeBtn = this.add.rectangle(w / 2, h / 2 + 190, 160, 38, 0xb71c1c);
    closeBtn.setInteractive({ useHandCursor: true });
    const closeTxt = this.add.text(w / 2, h / 2 + 190, 'ĐÓNG [X]', {
      fontFamily: '"Be Vietnam Pro", sans-serif',
      fontWeight: '800',
      fontSize: '13px',
      color: '#ffffff'
    }).setOrigin(0.5);

    closeBtn.on('pointerdown', () => {
      audioSynth.playClick();
      shop.destroy();
      this.isShopOpen = false;
    });

    shop.add([closeBtn, closeTxt]);
  }

  toggleInventoryModal() {
    if (this.isInventoryOpen) {
      if (this.invContainer) this.invContainer.destroy();
      this.isInventoryOpen = false;
      return;
    }

    this.isInventoryOpen = true;
    audioSynth.playClick();
    const w = this.cameras.main.width;
    const h = this.cameras.main.height;

    this.invContainer = this.add.container(0, 0).setScrollFactor(0);
    const dimmer = this.add.rectangle(w / 2, h / 2, w, h, 0x000000, 0.8).setInteractive();

    const panel = this.add.rectangle(w / 2, h / 2, 840, 520, 0x111628, 0.98);
    panel.setStrokeStyle(3, 0xffd700);

    const title = this.add.text(w / 2, h / 2 - 225, '⚔️ BẢNG QUẢN LÝ NHÂN VẬT (KAEL) ⚔️', {
      fontFamily: '"Be Vietnam Pro", sans-serif',
      fontWeight: '800',
      fontSize: '16px',
      color: '#ffd700'
    }).setOrigin(0.5);

    // Left Half: TÚI ĐỒ & TRANG BỊ
    const leftCard = this.add.rectangle(w / 2 - 200, h / 2 - 20, 380, 340, 0x1b233a);
    leftCard.setStrokeStyle(2, 0x4a6fa5);

    const invTitle = this.add.text(w / 2 - 200, h / 2 - 165, '🎒 TÚI ĐỒ (INVENTORY)', {
      fontFamily: '"Be Vietnam Pro", sans-serif',
      fontWeight: '800',
      fontSize: '13px',
      color: '#00e5ff'
    }).setOrigin(0.5);

    const eqText = [
      `• MŨ: ${GAME_DATA.player.equipment.helmet}`,

    for (let r = 0; r < 2; r++) {

        slot.setStrokeStyle(1, 0x64748b);
        const item = GAME_DATA.player.inventory[r * 4 + c];
        if (item) {
          this.add.text(w / 2 - 340 + c * 75, h / 2 + 25 + r * 60, item.icon, { fontSize: '18px' }).setOrigin(0.5);
          this.add.text(w / 2 - 340 + c * 75, h / 2 + 45 + r * 60, `x${item.count}`, { fontFamily: '"Be Vietnam Pro", sans-serif', fontWeight: '700', fontSize: '10px', color: '#ffd700' }).setOrigin(0.5);
        }

    const rightCard = this.add.rectangle(w / 2 + 200, h / 2 - 20, 380, 340, 0x1b233a);
    rightCard.setStrokeStyle(2, 0x4a6fa5);

    const statsTitle = this.add.text(w / 2 + 200, h / 2 - 165, '📊 BẢNG CHỈ SỐ & NHIỆM VỤ', {
      fontFamily: '"Be Vietnam Pro", sans-serif',
      fontWeight: '800',
      fontSize: '13px',

      `🛡️ PHÒNG NGỰ (DEF): ${GAME_DATA.player.defense}`,
      `🏃 TỐC ĐỘ (SPD): 12`,
      `💥 CHÍ MẠNG (CRIT): ${GAME_DATA.player.crit}%`,
      `--------------------------`,
      `📜 NHIỆM VỤ: TIÊU DIỆT 10 QUÁI VẬT`,
      `• Tiến độ: ${window.defeatedMonsters.length}/10 Quái Vật`,
      `• Phần thưởng: 500 VÀNG + HẠT GIỐNG`

    const statsLabel = this.add.text(w / 2 + 30, h / 2 - 135, stats.join('\n'), {

      fontFamily: '"Be Vietnam Pro", sans-serif',

  }
}

// ----------------------------------------------------------------------------
// 6. COMBAT SCENE (QUIZ COMBAT UI - GIỐNG CÂU HỎI.PNG & GIAO DIỆN 5.PNG 100%)
// ----------------------------------------------------------------------------
class CombatScene extends Phaser.Scene {
  constructor() {
    super('CombatScene');
  }

  init(data) {
    this.monsterData = data.monsterData;
    this.playerX = data.playerX;
    this.question = data.question;
    this.timeLeft = 20;
    this.timerEvent = null;
    this.isAnswering = false;
  }

  create() {
    const w = this.cameras.main.width;
    const h = this.cameras.main.height;

    this.add.rectangle(w / 2, h / 2, w, h, 0x070914, 0.94);

    // Combat ground platform at y = 415
    const combatGroundY = 415;
    this.add.rectangle(w / 2, combatGroundY + 5, w - 80, 8, 0x3a4b73).setDepth(2);
    this.add.rectangle(w / 2, combatGroundY + 1, w - 80, 2, 0x6888c8).setDepth(3);

    // Kael on the Left standing firmly on platform
    this.playerSprite = this.add.sprite(220, combatGroundY, 'player_idle_0');
    this.playerSprite.setOrigin(0.5, 1);
    this.playerSprite.setScale(0.85);
    this.playerSprite.setDepth(5);
    if (this.anims.exists('anim_player_idle')) this.playerSprite.play('anim_player_idle');

    const playerH = this.playerSprite.displayHeight || 160;
    this.add.text(220, combatGroundY - playerH - 25, 'Kael - Hiệp Sĩ', {
      fontFamily: '"Be Vietnam Pro", sans-serif',
      fontWeight: '800',
      fontSize: '12px',
      color: '#00e5ff'
    }).setOrigin(0.5).setDepth(6);

    // Monster on the Right (Naturally facing left towards Kael)
    let monTex = 'mon_' + this.monsterData.id;
    if (!this.textures.exists(monTex)) {
      if (this.monsterData.id === 'malakar_p1') monTex = 'mon_boss_malakar';
      else if (this.monsterData.id === 'malakar_p2') monTex = 'mon_boss_malakar_p2';
      else if (this.monsterData.type === 'boss') monTex = 'mon_boss_malakar';
      else monTex = 'mon_slime';
    }

    const isBoss = this.monsterData.type === 'boss';
    const isMedium = this.monsterData.type === 'medium';
    const mScale = isBoss ? 1.15 : (isMedium ? 0.9 : 0.95);

    this.monsterSprite = this.add.sprite(w - 240, combatGroundY, monTex);
    this.monsterSprite.setOrigin(0.5, 1);
    this.monsterSprite.setScale(mScale);
    this.monsterSprite.setDepth(5);

    // Face left towards Kael if naturally facing right
    if (this.monsterData.id === 'panther' || this.monsterData.id === 'mushroom') {
      this.monsterSprite.setFlipX(true);
    }

    const monH = this.monsterSprite.displayHeight || 160;
    const monUiY = Math.min(combatGroundY - monH - 20, 260);

    this.add.text(w - 240, monUiY - 25, this.monsterData.name, {
      fontFamily: '"Be Vietnam Pro", sans-serif',
      fontWeight: '800',
      fontSize: '12px',
      color: this.monsterData.type === 'boss' ? '#ff3366' : '#ffaa00'
    }).setOrigin(0.5).setDepth(6);

    // Monster HP Bar in Combat
    this.monHpBarFill = this.add.rectangle(w - 330, monUiY, 180, 14, 0xff2244).setOrigin(0, 0.5).setDepth(6);
    const monHpBarBg = this.add.rectangle(w - 240, monUiY, 180, 14, 0x330000).setDepth(5);
    monHpBarBg.setStrokeStyle(1, 0xffffff);

    this.monHpText = this.add.text(w - 240, monUiY, `${this.monsterData.hp} HP`, {
      fontFamily: '"Be Vietnam Pro", sans-serif',
      fontWeight: '800',
      fontSize: '10.5px',
      color: '#ffffff'
    }).setOrigin(0.5).setDepth(7);

    // Boss Giant HP Bar Banner if Boss Malakar
    if (this.monsterData.type === 'boss') {
      const bossBarBox = this.add.rectangle(w / 2, 45, 780, 48, 0x1a0510, 0.95).setDepth(10);
      bossBarBox.setStrokeStyle(3, 0xff0044);
      this.add.text(w / 2, 45, '👑 THẦN MA GIÁP HẮC ÁM (MALAKAR) - HP: 45,000 / 50,000 👑', {
        fontFamily: '"Be Vietnam Pro", sans-serif',
        fontWeight: '800',
        fontSize: '13px',
        color: '#ff2255'
      }).setOrigin(0.5).setDepth(11);
    }

    this.createQuizUI();
    this.startTimer();
  }

  createQuizUI() {
    const w = this.cameras.main.width;
    const h = this.cameras.main.height;

    const boxY = h - 165;
    const qBox = this.add.rectangle(w / 2, boxY, w - 60, 240, 0x0e1322, 0.98);
    qBox.setStrokeStyle(3, 0xffd700);

    // Monster & Topic Header
    this.add.text(w / 2, boxY - 95, `[ ${this.question.monsterTitle} ]`, {
      fontFamily: '"Be Vietnam Pro", sans-serif',
      fontWeight: '800',
      fontSize: '13px',
      color: '#ffd700'
    }).setOrigin(0.5);

    const timerW = 380;
    this.timerBarBg = this.add.rectangle(w / 2, boxY - 70, timerW, 10, 0x222233);
    this.timerBarFill = this.add.rectangle(w / 2 - timerW / 2, boxY - 70, timerW, 10, 0x00ff88).setOrigin(0, 0.5);
    this.timerText = this.add.text(w / 2 + timerW / 2 + 25, boxY - 70, '20s', {
      fontFamily: '"Be Vietnam Pro", sans-serif',
      fontWeight: '800',
      fontSize: '13px',
      color: '#00ff88'
    }).setOrigin(0, 0.5);

    this.qText = this.add.text(w / 2, boxY - 42, this.question.question, {
      fontFamily: '"Be Vietnam Pro", sans-serif',
      fontWeight: '700',
      fontSize: '14px',
      color: '#ffffff',
      align: 'center',
      wordWrap: { width: w - 120 },
      lineSpacing: 6
    }).setOrigin(0.5);

    this.optionButtons = [];
    const positions = [
      { x: w / 2 - 280, y: boxY + 18 },
      { x: w / 2 + 280, y: boxY + 18 },
      { x: w / 2 - 280, y: boxY + 74 },
      { x: w / 2 + 280, y: boxY + 74 }
    ];

    this.question.options.forEach((optText, idx) => {
      const pos = positions[idx];
      const btnBg = this.add.rectangle(pos.x, pos.y, 510, 44, 0x1b233a, 0.95);
      btnBg.setStrokeStyle(2, 0x4a6fa5);

      const label = this.add.text(pos.x - 240, pos.y, optText, {
        fontFamily: '"Be Vietnam Pro", sans-serif',
        fontWeight: '700',
        fontSize: '12px',
        color: '#ffffff',
        align: 'left',
        wordWrap: { width: 480 }
      }).setOrigin(0, 0.5);

      btnBg.setInteractive({ useHandCursor: true });

      btnBg.on('pointerover', () => {
        if (this.isAnswering) return;
        btnBg.fillColor = 0x2d3a5e;
        btnBg.setStrokeStyle(3, 0xffd700);
        label.setColor('#ffd700');
        audioSynth.playClick();
      });

      btnBg.on('pointerout', () => {
        if (this.isAnswering) return;
        btnBg.fillColor = 0x1b233a;
        btnBg.setStrokeStyle(2, 0x4a6fa5);
        label.setColor('#ffffff');
      });

      btnBg.on('pointerdown', () => {
        if (this.isAnswering) return;
        this.selectAnswer(idx, btnBg, label);
      });

      this.optionButtons.push({ bg: btnBg, label, originalText: optText });
    });
  }

  startTimer() {
    this.timeLeft = 20;
    this.timerEvent = this.time.addEvent({
      delay: 1000,
      repeat: 20,
      callback: () => {
        if (this.isAnswering) return;
        this.timeLeft--;
        const ratio = Math.max(0, this.timeLeft / 20);
        this.timerBarFill.width = 380 * ratio;

        if (this.timeLeft <= 5) {
          this.timerBarFill.fillColor = 0xff2244;
          this.timerText.setColor('#ff2244');
        } else if (this.timeLeft <= 10) {
          this.timerBarFill.fillColor = 0xffaa00;
          this.timerText.setColor('#ffaa00');
        }

        this.timerText.setText(`${this.timeLeft}s`);

        if (this.timeLeft <= 0) {
          this.handleTimeout();
        }
      }
    });
  }

  selectAnswer(selectedIdx, btnBg, label) {
    this.isAnswering = true;
    if (this.timerEvent) this.timerEvent.remove();

    const isCorrect = selectedIdx === this.question.correct;

    if (isCorrect) {
      btnBg.fillColor = 0x10552b;
      btnBg.setStrokeStyle(3, 0x00ff88);
      label.setText(`[ĐÚNG! ✔] ` + this.question.options[selectedIdx]);
      label.setColor('#00ff88');

      audioSynth.playCorrect();
      this.time.delayedCall(450, () => this.executePlayerAttack());
    } else {
      btnBg.fillColor = 0x5a1020;
      btnBg.setStrokeStyle(3, 0xff2244);
      label.setText(`[SAI! ✖] ` + this.question.options[selectedIdx]);
      label.setColor('#ff2244');

      const correctBtn = this.optionButtons[this.question.correct];
      correctBtn.bg.setStrokeStyle(3, 0x00ff88);
      correctBtn.label.setColor('#00ff88');

      audioSynth.playWrong();
      this.time.delayedCall(600, () => this.executeMonsterAttack());
    }
  }

  handleTimeout() {
    this.isAnswering = true;
    this.timerText.setText("HẾT GIỜ!");
    audioSynth.playWrong();

    const correctBtn = this.optionButtons[this.question.correct];
    correctBtn.bg.setStrokeStyle(3, 0x00ff88);
    correctBtn.label.setColor('#00ff88');

    this.time.delayedCall(600, () => this.executeMonsterAttack());
  }

  executePlayerAttack() {
    if (this.anims.exists('anim_player_attack')) {
      this.playerSprite.play('anim_player_attack');
    }
    audioSynth.playSwordSlash();

    this.tweens.add({
      targets: this.playerSprite,
      x: this.playerSprite.x + 90,
      duration: 160,
      yoyo: true,
      onYoyo: () => {
        audioSynth.playCritHit();
        this.cameras.main.shake(250, 0.018);

        const monMidY = this.monsterSprite.y - (this.monsterSprite.displayHeight / 2);
        const slash = this.add.image(this.monsterSprite.x, monMidY, 'vfx_crit').setDepth(8);
        slash.setScale(0.85);

        this.tweens.add({
          targets: slash,
          alpha: 0,
          scale: 1.3,
          duration: 350,
          onComplete: () => slash.destroy()
        });

        const dmgText = this.monsterData.type === 'boss' ? 'CRIT! -320' : 'CRIT! -150';
        this.showFloatingDamage(this.monsterSprite.x, this.monsterSprite.y - this.monsterSprite.displayHeight - 15, dmgText, '#ffd700');

        this.monsterSprite.setTint(0xff0000);
        this.tweens.add({
          targets: this.monsterSprite,
          x: this.monsterSprite.x + 40,
          alpha: 0.2,
          duration: 300,
          yoyo: true,
          repeat: 1,
          onComplete: () => {
            this.monsterSprite.clearTint();
            this.handleVictory();
          }
        });
      }
    });
  }

  executeMonsterAttack() {
    audioSynth.playMonsterAttack();

    this.tweens.add({
      targets: this.monsterSprite,
      x: this.monsterSprite.x - 90,
      duration: 180,
      yoyo: true,
      onYoyo: () => {
        audioSynth.playPlayerHurt();
        this.cameras.main.shake(300, 0.022);

        const playerMidY = this.playerSprite.y - (this.playerSprite.displayHeight / 2);
        const monVfx = this.monsterData.type === 'boss' ? 'boss_dark_slash' : (this.monsterData.id === 'mushroom' ? 'vfx_poison' : 'vfx_slash');
        if (this.textures.exists(monVfx)) {
          const hit = this.add.image(this.playerSprite.x, playerMidY, monVfx).setScale(0.85).setDepth(8);
          this.tweens.add({
            targets: hit,
            alpha: 0,
            scale: 1.2,
            duration: 350,
            onComplete: () => hit.destroy()
          });
        }

        this.playerSprite.setTint(0xff0000);
        this.showFloatingDamage(this.playerSprite.x, this.playerSprite.y - this.playerSprite.displayHeight - 15, `-${this.monsterData.attack} HP`, '#ff2244');

        GAME_DATA.player.hp = Math.max(0, GAME_DATA.player.hp - this.monsterData.attack);
        if (GAME_DATA.player.hp <= 30 && GAME_DATA.player.hearts > 1) {
          GAME_DATA.player.hearts--;
        }

        this.tweens.add({
          targets: this.playerSprite,
          x: this.playerSprite.x - 50,
          duration: 250,
          yoyo: true,
          onComplete: () => {
            this.playerSprite.clearTint();
            if (GAME_DATA.player.hp <= 0) {
              this.handlePlayerDefeat();
            } else {
              this.time.delayedCall(1200, () => this.resetForRetry());
            }
          }
        });
      }
    });
  }

  resetForRetry() {
    this.isAnswering = false;
    this.optionButtons.forEach((btn) => {
      btn.bg.fillColor = 0x1b233a;
      btn.bg.setStrokeStyle(2, 0x4a6fa5);
      btn.label.setText(btn.originalText);
      btn.label.setColor('#ffffff');
    });
    this.startTimer();
  }

  handleVictory() {
    GAME_DATA.player.gold += this.monsterData.gold;
    GAME_DATA.player.exp += this.monsterData.exp;

    audioSynth.playLevelUp();
    this.showFloatingDamage(this.playerSprite.x, this.playerSprite.y - 90, `+${this.monsterData.gold} VÀNG`, '#ffd700');

    if (GAME_DATA.player.exp >= GAME_DATA.player.maxExp) {
      GAME_DATA.player.level++;
      GAME_DATA.player.exp = 0;
      GAME_DATA.player.maxExp += 50;
      GAME_DATA.player.attack += 12;
      GAME_DATA.player.defense += 8;
      GAME_DATA.player.hp = GAME_DATA.player.maxHp;
      this.showLevelUpNotification();
    }

    this.time.delayedCall(1600, () => {
      if (this.question.id === 10) {
        this.scene.stop('GameScene');
        this.scene.start('VictoryScene');
      } else {
        this.scene.stop();
        this.scene.resume('GameScene');
        const gameScene = this.scene.get('GameScene');
        if (gameScene) {
          gameScene.handleDefeatedMonster(this.monsterData.id);
        }
      }
    });
  }

  handlePlayerDefeat() {
    this.cameras.main.fade(600, 0, 0, 0);
    this.time.delayedCall(650, () => {
      this.scene.stop('GameScene');
      this.scene.start('GameOverScene');
    });
  }

  showFloatingDamage(x, y, text, color) {
    const dmg = this.add.text(x, y, text, {
      fontFamily: '"Be Vietnam Pro", sans-serif',
      fontWeight: '900',
      fontSize: '18px',
      color: color,
      stroke: '#000000',
      strokeThickness: 5
    }).setOrigin(0.5);

    this.tweens.add({
      targets: dmg,
      y: y - 50,
      alpha: 0,
      duration: 1000,
      onComplete: () => dmg.destroy()
    });
  }

  showLevelUpNotification() {
    const w = this.cameras.main.width;
    const banner = this.add.container(w / 2, 140);
    const bg = this.add.rectangle(0, 0, 420, 52, 0x111c38, 0.95);
    bg.setStrokeStyle(3, 0xffd700);

    const txt = this.add.text(0, 0, `🪽 LÊN CẤP! (LV.${GAME_DATA.player.level}) 🪽`, {
      fontFamily: '"Be Vietnam Pro", sans-serif',
      fontWeight: '800',
      fontSize: '15px',
      color: '#ffd700'
    }).setOrigin(0.5);

    banner.add([bg, txt]);
    this.tweens.add({
      targets: banner,
      scale: 1.1,
      duration: 250,
      yoyo: true,
      repeat: 3,
      onComplete: () => banner.destroy()
    });
  }
}

// ----------------------------------------------------------------------------
// 9. PHASER INITIALIZATION
// ----------------------------------------------------------------------------
window.addEventListener('load', () => {
  const config = {
    type: Phaser.AUTO,
    parent: 'game-container',
    pixelArt: true,
    roundPixels: true,
    scale: {
      mode: Phaser.Scale.FIT,
      parent: 'game-container',
      autoCenter: Phaser.Scale.CENTER_BOTH,
      width: 1280,
      height: 720
    },
    physics: {
      default: 'arcade',
      arcade: {
        gravity: { y: 880 },
        debug: false
      }
    },
    scene: [
      PreloadScene,
      MenuScene,
      GameScene,
      CombatScene,
      VictoryScene,
      GameOverScene
    ]
  };

  window.game = new Phaser.Game(config);

  // Mobile Virtual Touch Controls
  window.touchControls = {
    left: false,
    right: false,
    jump: false,
    interact: false,
    interactJustPressed: false
  };

  const virtualControlsEl = document.getElementById('virtual-controls');
  const isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0) || (window.innerWidth <= 1024);

  window.showVirtualControls = () => {
    if (virtualControlsEl && (isTouchDevice || window.innerWidth <= 1024)) {
      virtualControlsEl.classList.add('visible');
    }
  };

  window.hideVirtualControls = () => {
    if (virtualControlsEl) {
      virtualControlsEl.classList.remove('visible');
    }
  };

  function bindTouchBtn(btnId, onDown, onUp) {
    const btn = document.getElementById(btnId);
    if (!btn) return;
    const startAction = (e) => {
      if (e.cancelable) e.preventDefault();
      btn.classList.add('active');
      if (navigator.vibrate) try { navigator.vibrate(12); } catch(err){}
      onDown();
    };
    const endAction = (e) => {
      if (e.cancelable) e.preventDefault();
      btn.classList.remove('active');
      onUp();
    };
    btn.addEventListener('pointerdown', startAction);
    btn.addEventListener('pointerup', endAction);
    btn.addEventListener('pointercancel', endAction);
    btn.addEventListener('pointerleave', endAction);
    btn.addEventListener('touchstart', startAction, { passive: false });
    btn.addEventListener('touchend', endAction, { passive: false });
    btn.addEventListener('touchcancel', endAction, { passive: false });
  }

  bindTouchBtn('vbtn-left', 
    () => { window.touchControls.left = true; }, 
    () => { window.touchControls.left = false; }
  );

  bindTouchBtn('vbtn-right', 
    () => { window.touchControls.right = true; }, 
    () => { window.touchControls.right = false; }
  );

  bindTouchBtn('vbtn-jump', 
    () => { window.touchControls.jump = true; }, 
    () => { window.touchControls.jump = false; }
  );

  bindTouchBtn('vbtn-interact', 
    () => {
      window.touchControls.interact = true;
      window.touchControls.interactJustPressed = true;
    }, 
    () => { window.touchControls.interact = false; }
  );

  // Mobile Orientation Hint Logic
  const orientHint = document.getElementById('orientation-hint');
  const dismissOrientBtn = document.getElementById('dismiss-orient-btn');
  let orientDismissed = false;

  const checkOrientation = () => {
    if (orientDismissed) return;
    const isPortrait = window.innerHeight > window.innerWidth && window.innerWidth <= 900;
    if (orientHint) {
      if (isPortrait && isTouchDevice) {
        orientHint.classList.add('active');
      } else {
        orientHint.classList.remove('active');
      }
    }
  };

  if (dismissOrientBtn) {
    dismissOrientBtn.addEventListener('click', () => {
      orientDismissed = true;
      if (orientHint) orientHint.classList.remove('active');
    });
  }

  window.addEventListener('resize', checkOrientation);
  window.addEventListener('orientationchange', () => {
    setTimeout(checkOrientation, 200);
  });
  checkOrientation();

  // Mobile AudioContext auto-unlock on first touch
  window.addEventListener('touchstart', () => audioSynth.resume(), { once: true });

  const muteBtn = document.getElementById('mute-btn');
  const muteIcon = document.getElementById('mute-icon');
  const muteText = document.getElementById('mute-text');
  const toggleSound = () => {
    const isMuted = audioSynth.toggleMute();
    if (muteIcon) muteIcon.textContent = isMuted ? '🔇' : '🔊';
    if (muteText) muteText.textContent = isMuted ? 'ĐÃ TẮT TIẾNG [M]' : 'ÂM THANH [M]';
  };
  if (muteBtn) {
    muteBtn.addEventListener('click', toggleSound);
  }

  const fullscreenBtn = document.getElementById('fullscreen-btn');
  const fsIcon = document.getElementById('fs-icon');
  const fsText = document.getElementById('fs-text');
  const stretchBtn = document.getElementById('stretch-btn');

  let isCssFullscreen = false;
  let isStretchMode = false;

  const updateFullscreenUI = (isFS) => {
    if (fsIcon) fsIcon.textContent = isFS ? '🗗' : '🖥️';
    if (fsText) fsText.textContent = isFS ? 'THU NHỎ [F]' : 'TOÀN MÀN HÌNH [F]';
    if (fullscreenBtn) fullscreenBtn.setAttribute('title', isFS ? 'Thu nhỏ màn hình [Phím F hoặc ESC]' : 'Phóng to Toàn màn hình [Phím F hoặc F11]');
    if (window.game && window.game.scale) {
      window.game.scale.refresh();
      setTimeout(() => { if (window.game && window.game.scale) window.game.scale.refresh(); }, 120);
    }
  };

  const activateCssFullscreen = () => {
    isCssFullscreen = true;
    document.body.classList.add('is-fullscreen');
    const container = document.getElementById('game-container');
    if (container) container.classList.add('pseudo-fullscreen');
    updateFullscreenUI(true);
  };

  const deactivateCssFullscreen = () => {
    isCssFullscreen = false;
    document.body.classList.remove('is-fullscreen');
    const container = document.getElementById('game-container');
    if (container) container.classList.remove('pseudo-fullscreen');
    updateFullscreenUI(false);
  };

  const toggleFullScreen = () => {
    // Check if in Native Fullscreen
    const nativeFS = document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement;

    if (nativeFS) {
      if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
      else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      else if (document.msExitFullscreen) document.msExitFullscreen();
      deactivateCssFullscreen();
      return;
    }

    if (isCssFullscreen) {
      deactivateCssFullscreen();
      return;
    }

    // 1. Try Phaser scale manager fullscreen
    if (window.game && window.game.scale && typeof window.game.scale.startFullscreen === 'function') {
      try {
        window.game.scale.startFullscreen();
        isCssFullscreen = false;
        document.body.classList.add('is-fullscreen');
        updateFullscreenUI(true);
        return;
      } catch (err) {
        console.warn('Phaser startFullscreen failed, trying native requestFullscreen', err);
      }
    }

    // 2. Try HTML5 standard requestFullscreen on documentElement
    const docEl = document.documentElement || document.getElementById('game-container') || document.body;
    const reqFn = docEl.requestFullscreen || docEl.webkitRequestFullscreen || docEl.mozRequestFullScreen || docEl.msRequestFullscreen;

    if (reqFn) {
      try {
        const promise = reqFn.call(docEl);
        if (promise && typeof promise.then === 'function') {
          promise.then(() => {
            isCssFullscreen = false;
            document.body.classList.add('is-fullscreen');
            updateFullscreenUI(true);
          }).catch((err) => {
            console.warn('Native requestFullscreen blocked, activating CSS Fullscreen fallback:', err);
            activateCssFullscreen();
          });
          return;
        } else {
          isCssFullscreen = false;
          document.body.classList.add('is-fullscreen');
          updateFullscreenUI(true);
          return;
        }
      } catch (e) {
        console.warn('requestFullscreen exception, using fallback:', e);
        activateCssFullscreen();
        return;
      }
    }

    // 3. Fallback if Fullscreen API is unavailable
    activateCssFullscreen();
  };

  if (fullscreenBtn) {
    fullscreenBtn.addEventListener('click', toggleFullScreen);
  }

  // Toggle Stretch Fill Mode (Phóng to tràn viền 100%)
  const toggleStretchMode = () => {
    isStretchMode = !isStretchMode;
    const container = document.getElementById('game-container');
    if (container) {
      if (isStretchMode) container.classList.add('stretch-mode');
      else container.classList.remove('stretch-mode');
    }
    if (stretchBtn) {
      stretchBtn.innerHTML = isStretchMode 
        ? '<span class="btn-icon">📐</span> <span class="btn-text">CHUẨN 16:9 [Z]</span>'
        : '<span class="btn-icon">📐</span> <span class="btn-text">TRÀN VIỀN [Z]</span>';
    }
    if (window.game && window.game.scale) {
      window.game.scale.refresh();
      setTimeout(() => { if (window.game && window.game.scale) window.game.scale.refresh(); }, 100);
    }
  };

  if (stretchBtn) {
    stretchBtn.addEventListener('click', toggleStretchMode);
  }

  document.addEventListener('fullscreenchange', () => {
    const isFS = !!(document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement);
    isCssFullscreen = isFS;
    if (isFS) document.body.classList.add('is-fullscreen');
    else document.body.classList.remove('is-fullscreen');
    updateFullscreenUI(isFS);
  });

  window.addEventListener('resize', () => {
    if (window.game && window.game.scale) {
      window.game.scale.refresh();
      setTimeout(() => { if (window.game && window.game.scale) window.game.scale.refresh(); }, 100);
    }
  });

  // Global PC Hotkeys: [F] Fullscreen, [Z] Stretch Fill, [M] Mute sound, [Escape] Exit Fullscreen
  window.addEventListener('keydown', (e) => {
    if (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA') return;

    if (e.key === 'f' || e.key === 'F') {
      toggleFullScreen();
    } else if (e.key === 'z' || e.key === 'Z') {
      toggleStretchMode();
    } else if (e.key === 'm' || e.key === 'M') {
      toggleSound();
    } else if (e.key === 'Escape' && isCssFullscreen) {
      toggleFullScreen();
    }
  });
});
  </script>
